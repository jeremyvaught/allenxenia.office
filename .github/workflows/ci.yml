name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  dotnet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run build:css
      - name: Verify local SQLite snapshots
        run: python3 -m unittest discover -s tests/scripts -v
      - run: dotnet tool restore
      - run: dotnet restore --locked-mode
      - run: dotnet build --configuration Release --no-restore
      - name: Test with coverage and generate reports
        run: ./scripts/coverage.sh
      - name: Preserve coverage and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-and-test-results
          path: artifacts/coverage/
          if-no-files-found: warn
          retention-days: 14
      - run: dotnet format --verify-no-changes --no-restore
      - run: ./scripts/verify-mysql.sh
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - name: Preserve SQL report evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-report-evidence
          path: artifacts/reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve telemetry incident evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-incident-evidence
          path: artifacts/telemetry/
          if-no-files-found: warn
          retention-days: 14

      - name: Package verified self-contained Linux x64 release
        run: python3 scripts/package-release.py build
      - name: Verify published Linux process and MySQL restoration
        run: |
          for release in artifacts/releases/release-*/; do
            python3 scripts/verify-release.py "$release"
          done
      - name: Preserve published recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-recovery-evidence
          path: artifacts/release-verification/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve self-contained release with executable permissions
        uses: actions/upload-artifact@v4
        with:
          name: allen-office-release-${{ github.sha }}
          path: artifacts/releases/release-*.tar.gz
          if-no-files-found: error
          retention-days: 14
